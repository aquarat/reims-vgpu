[package]
name = "reims-vgpu-backend"
version = "0.1.0"
edition = "2021"
description = "Out-of-process Reims vGPU device: serves a VMM's apv-gpu-proxy device over the apv-gpu-proxy protocol"
license = "LGPL-3.0-or-later"

[[bin]]
name = "reims-vgpu-backend"
path = "src/main.rs"

[features]
# The in-process QEMU build compiles the device with host-window, and a few
# engine paths are shaped by that feature even when no window is open. Built
# the same way so the two are compared like for like; this process never opens
# a window (yet).
default = ["host-window"]
host-window = ["reims-vgpu/host-window"]

[dependencies]
reims-vgpu = { path = "../reims-vgpu", default-features = false, features = ["backend-vulkan"] }
reims-vgpu-proxy-wire = { path = "../reims-vgpu-proxy-wire" }
libc = "0.2"
